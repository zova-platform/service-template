version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - revive
    - unconvert
  exclusions:
    rules:
      - linters: [revive]
        text: "exported|package-comments|should have a package comment"

formatters:
  enable:
    - gofmt
    - goimports
